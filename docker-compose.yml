version: '3.8'
services:
  backend:
    build: ./backend
    container_name: backend

  frontend:
    build: ./frontend
    container_name: frontend

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "8081:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - backend
    restart: always
